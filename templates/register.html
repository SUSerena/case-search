<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 案例检索系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo svg {
            width: 48px;
            height: 48px;
            color: var(--secondary);
        }
        .auth-logo h1 {
            font-size: 20px;
            color: var(--text);
            margin-top: 12px;
            font-weight: 600;
        }
        .auth-logo p {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: var(--transition);
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .form-group .hint {
            font-size: 12px;
            color: var(--text-lighter);
            margin-top: 4px;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--secondary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-btn:hover {
            background: #008f76;
        }
        .auth-error {
            background: #fee;
            color: var(--danger);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #fcc;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-light);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="8.5" cy="7" r="4"/>
                <line x1="20" y1="8" x2="20" y2="14"/>
                <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            <h1>用户注册</h1>
            <p>注册后即可使用案例检索系统</p>
        </div>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>手机号</label>
                <input type="text" name="phone" value="{{ phone or '' }}" placeholder="请输入11位手机号" pattern="1[3-9]\d{9}" required>
                <div class="hint">用于登录和找回密码</div>
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" value="{{ username or '' }}" placeholder="请输入用户名（至少2个字符）" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码（至少6个字符）" required>
            </div>
            <button type="submit" class="auth-btn">注 册</button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="{{ url_for('login') }}">去登录</a>
        </div>
    </div>
</body>
</html>
