{% extends "base.html" %}

{% block title %}编辑 - {{ project.project_name }}{% endblock %}

{% block content %}
<div class="container">
    <button class="back-btn" onclick="history.back()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        返回详情
    </button>

    <div class="page-header">
        <h1 class="page-title">编辑项目案例</h1>
    </div>

    <form method="post" id="editForm">
        <!-- 基本信息 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-body">
                <div class="detail-section-title" style="margin-bottom: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    基本信息
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">项目名称 <span class="required">*</span></label>
                        <input type="text" name="project_name" class="form-input" value="{{ project.project_name }}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">项目类型 <span class="required">*</span></label>
                        <select name="project_type" class="form-select">
                            <option value="网箱" {% if project.project_type == '网箱' %}selected{% endif %}>网箱</option>
                            <option value="平台" {% if project.project_type == '平台' %}selected{% endif %}>平台</option>
                            <option value="平台＋网箱" {% if '平台' in project.project_type and '网箱' in project.project_type %}selected{% endif %}>平台＋网箱</option>
                            <option value="防波堤" {% if project.project_type == '防波堤' %}selected{% endif %}>防波堤</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">业务人员</label>
                        <input type="text" name="sales_person" class="form-input" value="{{ project.sales_person or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认日期</label>
                        <input type="date" name="confirm_date" class="form-input" value="{{ project.confirm_date or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">项目所在地</label>
                        <input type="text" name="location" class="form-input" value="{{ project.location or '' }}" placeholder="如：连云港">
                    </div>
                    <div class="form-group">
                        <label class="form-label">所属省份</label>
                        <input type="text" name="province" class="form-input" value="{{ project.province or '' }}" placeholder="如：江苏">
                    </div>
                    <div class="form-group">
                        <label class="form-label">所属海域</label>
                        <select name="sea_area" class="form-select">
                            <option value="">请选择</option>
                            {% for sea in sea_areas %}
                            <option value="{{ sea }}" {% if project.sea_area == sea %}selected{% endif %}>{{ sea }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">海域坐标</label>
                        <input type="text" name="coordinates" class="form-input" value="{{ project.coordinates or '' }}" placeholder="如：119°41E，34°50N">
                    </div>
                    <div class="form-group">
                        <label class="form-label">项目规模</label>
                        <input type="text" name="project_scale" class="form-input" value="{{ project.project_scale or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">建设工期</label>
                        <input type="text" name="construction_period" class="form-input" value="{{ project.construction_period or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">预算/投资</label>
                        <input type="text" name="budget" class="form-input" value="{{ project.budget or '' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">项目描述/案例总结</label>
                    <textarea name="description" class="form-textarea" rows="4" placeholder="项目概述、特点、经验总结等">{{ project.description or '' }}</textarea>
                </div>
            </div>
        </div>

        <!-- 海况参数 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-body">
                <div class="detail-section-title" style="margin-bottom: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20"/><path d="M2 6h20"/><path d="M2 18h20"/></svg>
                    海况参数
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">满潮水深 (m)</label>
                        <input type="number" step="0.1" name="water_depth" class="form-input" value="{{ project.sea_conditions.water_depth or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">水位差 (m)</label>
                        <input type="number" step="0.1" name="water_level_diff" class="form-input" value="{{ project.sea_conditions.water_level_diff or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">最大波高 (m)</label>
                        <input type="number" step="0.1" name="max_wave_height" class="form-input" value="{{ project.sea_conditions.max_wave_height or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">最大流速 (m/s)</label>
                        <input type="number" step="0.1" name="max_flow_speed" class="form-input" value="{{ project.sea_conditions.max_flow_speed or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">流向</label>
                        <input type="text" name="flow_direction" class="form-input" value="{{ project.sea_conditions.flow_direction or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">底质类型</label>
                        <input type="text" name="seabed_type" class="form-input" value="{{ project.sea_conditions.seabed_type or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">常风向</label>
                        <input type="text" name="common_wind_direction" class="form-input" value="{{ project.sea_conditions.common_wind_direction or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">最大风向</label>
                        <input type="text" name="max_wind_direction" class="form-input" value="{{ project.sea_conditions.max_wind_direction or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">最大风速 (m/s)</label>
                        <input type="number" step="0.1" name="max_wind_speed" class="form-input" value="{{ project.sea_conditions.max_wind_speed or '' }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- 网箱技术参数 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-body">
                <div class="detail-section-title" style="margin-bottom: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    网箱技术参数
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">管径</label>
                        <input type="text" name="cage_pipe_diameter" class="form-input" value="{{ project.cage_params.pipe_diameter or '' }}" placeholder="如：DN500,双层">
                    </div>
                    <div class="form-group">
                        <label class="form-label">周长 (m)</label>
                        <input type="number" step="0.1" name="cage_perimeter" class="form-input" value="{{ project.cage_params.perimeter or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">直径 (m)</label>
                        <input type="number" step="0.1" name="cage_diameter" class="form-input" value="{{ project.cage_params.diameter or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">网箱数量 (口)</label>
                        <input type="number" name="cage_cage_count" class="form-input" value="{{ project.cage_params.cage_count or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">网箱类型</label>
                        <input type="text" name="cage_cage_type" class="form-input" value="{{ project.cage_params.cage_type or '' }}" placeholder="如：圆形、抗风浪型">
                    </div>
                    <div class="form-group">
                        <label class="form-label">支架间距</label>
                        <input type="text" name="cage_bracket_spacing" class="form-input" value="{{ project.cage_params.bracket_spacing or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">过道宽度</label>
                        <input type="text" name="cage_walkway_width" class="form-input" value="{{ project.cage_params.walkway_width or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">系缆加强套管</label>
                        <input type="text" name="cage_mooring_sleeve" class="form-input" value="{{ project.cage_params.mooring_sleeve or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">锚点数量</label>
                        <input type="number" name="cage_anchor_point_count" class="form-input" value="{{ project.cage_params.anchor_point_count or '' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">网衣需求</label>
                    <textarea name="cage_net_demand" class="form-textarea" rows="2" placeholder="网衣规格、是否需要盖网、撑网架等">{{ project.cage_params.net_demand or '' }}</textarea>
                </div>
            </div>
        </div>

        <!-- 平台技术参数 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-body">
                <div class="detail-section-title" style="margin-bottom: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                    平台技术参数
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">管径</label>
                        <input type="text" name="platform_pipe_diameter" class="form-input" value="{{ project.platform_params.pipe_diameter or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">平台面积 (m²)</label>
                        <input type="number" step="0.1" name="platform_platform_area" class="form-input" value="{{ project.platform_params.platform_area or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">尺寸规格</label>
                        <input type="text" name="platform_size_spec" class="form-input" value="{{ project.platform_params.size_spec or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">造型要求</label>
                        <input type="text" name="platform_shape_requirement" class="form-input" value="{{ project.platform_params.shape_requirement or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">承载力</label>
                        <input type="text" name="platform_bearing_capacity" class="form-input" value="{{ project.platform_params.bearing_capacity or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">靠泊船只</label>
                        <input type="text" name="platform_docking_ships" class="form-input" value="{{ project.platform_params.docking_ships or '' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">附属设施</label>
                    <textarea name="platform_附属设施" class="form-textarea" rows="2">{{ project.platform_params.附属设施 or '' }}</textarea>
                </div>
            </div>
        </div>

        <!-- 防波堤参数 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-body">
                <div class="detail-section-title" style="margin-bottom: 20px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/></svg>
                    防波堤技术参数
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">管径</label>
                        <input type="text" name="breakwater_pipe_diameter" class="form-input" value="{{ project.breakwater_params.pipe_diameter or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">规格选型</label>
                        <input type="text" name="breakwater_spec_type" class="form-input" value="{{ project.breakwater_params.spec_type or '' }}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">支架间距</label>
                        <input type="text" name="breakwater_bracket_spacing" class="form-input" value="{{ project.breakwater_params.bracket_spacing or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">减波率要求</label>
                        <input type="text" name="breakwater_wave_reduction_rate" class="form-input" value="{{ project.breakwater_params.wave_reduction_rate or '' }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- 提交按钮 -->
        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 40px;">
            <a href="{{ url_for('project_detail', project_id=project.id) }}" class="btn btn-secondary">取消</a>
            <button type="submit" class="btn btn-primary">保存修改</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<style>
.form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 12px;
}
@media (max-width: 768px) {
    .form-row {
        grid-template-columns: 1fr 1fr;
    }
}
@media (max-width: 480px) {
    .form-row {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}
