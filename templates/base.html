<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}深水网箱历史案例检索系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 20h20M4 20V10l8-6 8 6v10"/>
                    <path d="M9 20v-6h6v6"/>
                    <circle cx="12" cy="6" r="1"/>
                </svg>
                <span>案例检索系统</span>
            </div>
            <nav class="nav">
                <a href="{{ url_for('index') }}" class="nav-item {% if request.path == '/' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    案例库
                </a>
                <a href="{{ url_for('search_page') }}" class="nav-item {% if '/search' in request.path %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    智能检索
                </a>
                <a href="{{ url_for('import_page') }}" class="nav-item {% if '/import' in request.path %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    数据导入
                </a>
                {% if session.get('role') == 'admin' %}
                <a href="{{ url_for('admin_users') }}" class="nav-item {% if '/admin' in request.path %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    后台管理
                </a>
                {% endif %}
            </nav>
            <div class="nav-user">
                <span class="nav-username">{{ session.get('username', '') }}</span>
                {% if session.get('role') == 'admin' %}
                <span class="nav-badge">管理员</span>
                {% endif %}
                <a href="{{ url_for('logout') }}" class="nav-logout">退出</a>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <!-- 底部 -->
    <footer class="footer">
        <div class="container">
            <p>深水网箱/浮动平台历史案例智能检索系统 &copy; 2026</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
